apply plugin: "com.android.application"

def platformKeystorePath = System.getenv("KEMI_PLATFORM_KEYSTORE")
def platformStorePassword = System.getenv("KEMI_PLATFORM_STORE_PASSWORD")
def platformKeyAlias = System.getenv("KEMI_PLATFORM_KEY_ALIAS")
def platformKeyPassword = System.getenv("KEMI_PLATFORM_KEY_PASSWORD")
def platformSigningReady = platformKeystorePath != null && platformStorePassword != null
        && platformKeyAlias != null && platformKeyPassword != null

android {
    namespace "com.kemi.mypad"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.kemi.mypad"
        minSdk 31
        targetSdk 31
        versionCode 10000
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (platformSigningReady) {
            platform {
                storeFile file(platformKeystorePath)
                storePassword platformStorePassword
                keyAlias platformKeyAlias
                keyPassword platformKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig platformSigningReady ? signingConfigs.platform : null
        }
    }

    lint {
        // KEMI Pads v1 targets the fixed Android 12 system image used by the dual-screen hardware.
        // Listing/managing all apps and the signed system-management channel are core product functions.
        disable "ExpiredTargetSdkVersion", "ProtectedPermissions", "QueryAllPackagesPermission"
    }
}

gradle.taskGraph.whenReady { graph ->
    boolean buildingRelease = graph.allTasks.any { it.path.endsWith(":assembleRelease") || it.path.endsWith(":bundleRelease") }
    if (buildingRelease && !platformSigningReady) {
        throw new GradleException("Release requires KEMI platform signing environment variables; unsigned fallback is forbidden")
    }
}
